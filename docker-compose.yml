services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: la_grande_cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d la_grande_cinema"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://cinema:cinema@postgres:5432/la_grande_cinema?schema=public
      JWT_SECRET: docker-development-only-change-me
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
