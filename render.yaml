databases:
  - name: la-grande-cinema-db
    plan: free
    databaseName: la_grande_cinema
    user: cinema

services:
  - type: web
    name: la-grande-cinema-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: la-grande-cinema-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://la-grande-cinema.onrender.com
